  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          layouts: saved.layouts &amp;&amp; typeof saved.layouts === &#x27;object&#x27; ? saved.layouts : workspaceState.layouts,
          strokes: Array.isArray(saved.strokes) ? saved.strokes : [],
          canvasNotes: Array.isArray(saved.canvasNotes) ? saved.canvasNotes : []
        };
      }
    } catch (error) {
      saveStatus.textContent = &#x27;Local backup could not be read&#x27;;
    }

    const nodeFor = (id) =&gt; root.querySelector(`[data-node=&quot;${id}&quot;]`);

    function setLayout(force = false) {
      const nextMobile = field.clientWidth &lt;= 520;
      if (!force &amp;&amp; nextMobile === mobileMode) return;
      mobileMode = nextMobile;
      const source = nextMobile ? mobile : desktop;
      const savedLayout = workspaceState.layouts[nextMobile ? &#x27;mobile&#x27; : &#x27;desktop&#x27;];
      positions = Object.fromEntries(Object.entries(source).map(([id, value]) =&gt; [
        id,
        savedLayout &amp;&amp; Array.isArray(savedLayout[id]) ? [...savedLayout[id]] : [...value]
      ]));
      render();
    }

    function screenPosition(id) {
      const [x, y] = positions[id];
      const scale = Number(zoom.value) / 100;
      return [
        Math.max(4, Math.min(96, 50 + (x - 50) * scale)),
        Math.max(3, Math.min(97, 50 + (y - 50) * scale))
      ];
    }

    function drawEdges() {
      const box = field.getBoundingClientRect();
      svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${box.width} ${box.height}`);
      svg.replaceChildren();
      edges.forEach(([from, to]) =&gt; {
        const a = nodeFor(from);
        const b = nodeFor(to);
        if (!a || !b) return;
        const ar = a.getBoundingClientRect();
        const br = b.getBoundingClientRect();
        const x1 = ar.left + ar.width / 2 - box.left;
        const y1 = ar.top + ar.height / 2 - box.top;
        const x2 = br.left + br.width / 2 - box.left;
        const y2 = br.top + br.height / 2 - box.top;
        const curve = Math.max(18, Math.abs(y2 - y1) * 0.38);
        const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
        path.setAttribute(&#x27;d&#x27;, `M ${x1} ${y1} C ${x1} ${y1 + curve}, ${x2} ${y2 - curve}, ${x2} ${y2}`);
        path.setAttribute(&#x27;class&#x27;, &#x27;canvas-edge&#x27;);
        path.dataset.from = from;
        path.dataset.to = to;
        svg.appendChild(path);
      });
      updateSelectionStyles();
    }

    function render() {
      nodes.forEach((node) =&gt; {
        const [x, y] = screenPosition(node.dataset.node);
        node.style.left = `${x}%`;
        node.style.top = `${y}%`;
      });
      zoomValue.value = `${zoom.value}%`;
      requestAnimationFrame(drawEdges);
    }

    function updateSelectionStyles() {
      const connected = new Set([selected]);
      const showAll = selected === &#x27;mykit&#x27;;
      edges.forEach(([from, to]) =&gt; {
        if (from === selected) connected.add(to);
        if (to === selected) connected.add(from);
      });
      nodes.forEach((node) =&gt; {
        const active = node.dataset.node === selected;
        node.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        node.classList.toggle(&#x27;is-dimmed&#x27;, !showAll &amp;&amp; !connected.has(node.dataset.node));
      });
      svg.querySelectorAll(&#x27;.canvas-edge&#x27;).forEach((edge) =&gt; {
        const active = edge.dataset.from === selected || edge.dataset.to === selected;
        edge.classList.toggle(&#x27;is-active&#x27;, active);
        edge.classList.toggle(&#x27;is-dimmed&#x27;, !showAll &amp;&amp; !active);
      });
    }

    function connectedLabels(id) {
      const related = [];
      edges.forEach(([from, to]) =&gt; {
        if (from === id) related.push(labels[to]);
        if (to === id) related.push(labels[from]);
      });
      return [...new Set(related)];
    }

    function renderChips(container, items) {
      container.replaceChildren();
      items.forEach((item) =&gt; {
        const chip = document.createElement(&#x27;span&#x27;);
        chip.className = &#x27;viz-badge&#x27;;
        chip.textContent = item;
        container.appendChild(chip);
      });
    }

    function selectNode(id) {
      selected = id;
      const detail = details[id];
      groupLabel.textContent = detail.group;
      selection.textContent = labels[id];
      description.textContent = descriptions[id];
      purpose.textContent = detail.purpose;
      includes.textContent = detail.includes;
      renderChips(connections, connectedLabels(id));
      renderChips(inputs, detail.inputs);
      renderChips(outputs, detail.outputs);
      updateSelectionStyles();
      if (!quickEntry.value.trim()) entryNode.value = id;
      renderEntries();
      scheduleSave();
    }

    function collectWorkspaceState() {
      workspaceState.layouts[mobileMode ? &#x27;mobile&#x27; : &#x27;desktop&#x27;] = Object.fromEntries(
        Object.entries(positions).map(([id, value]) =&gt; [id, [...value]])
      );
      workspaceState.strokes = Array.from(annotationSvg.querySelectorAll(&#x27;.annotation-stroke&#x27;))
        .map((path) =&gt; path.getAttribute(&#x27;d&#x27;))
        .filter(Boolean);
      workspaceState.canvasNotes = Array.from(notesLayer.querySelectorAll(&#x27;.annotation-note&#x27;)).map((note) =&gt; ({
        left: note.style.left,
        top: note.style.top,
        text: note.value
      }));
      workspaceState.zoom = Number(zoom.value);
      workspaceState.selected = selected;
    }

    function saveWorkspace() {
      collectWorkspaceState();
      try {
        localStorage.setItem(storageKey, JSON.stringify(workspaceState));
        saveStatus.textContent = &#x27;Saved now&#x27;;
        clearTimeout(saveStatusTimer);
        saveStatusTimer = setTimeout(() =&gt; {
          saveStatus.textContent = &#x27;Saved locally&#x27;;
        }, 1400);
      } catch (error) {

    }

    function scheduleSave() {
      clearTimeout(scheduleSave.timer);
      saveStatus.textContent = &#x27;Saving…&#x27;;
      scheduleSave.timer = setTimeout(saveWorkspace, 180);
    }

    function clearComposer() {
      editingId = null;
      quickEntry.value = &#x27;&#x27;;
      entryTags.value = &#x27;&#x27;;
      entryType.value = &#x27;note&#x27;;
      entryNode.value = selected;
      saveEntryButton.innerHTML = &#x27;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Save entry&#x27;;
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? &#x27;&#x27; : date.toLocaleString([], {
        month: &#x27;short&#x27;, day: &#x27;numeric&#x27;, hour: &#x27;numeric&#x27;, minute: &#x27;2-digit&#x27;
      });
    }

    function entryMatches(entry) {
      const query = entrySearch.value.trim().toLowerCase();
      if (currentOnly.checked &amp;&amp; entry.node !== selected) return false;
      if (!query) return true;
      return [
        entry.text,
        entry.type,
        labels[entry.node] || entry.node,
        ...(entry.tags || [])
      ].join(&#x27; &#x27;).toLowerCase().includes(query);
    }

    function renderEntries() {
      const filtered = workspaceState.entries.filter(entryMatches);
      entryList.replaceChildren();
      entryCount.textContent = `${workspaceState.entries.length} saved`;

      if (!filtered.length) {
        const empty = document.createElement(&#x27;p&#x27;);
        empty.className = &#x27;entry-empty&#x27;;
        empty.textContent = workspaceState.entries.length
          ? &#x27;No saved information matches this view.&#x27;
          : &#x27;Your saved ideas, questions, tasks, and records will appear here.&#x27;;
        entryList.appendChild(empty);
        return;
      }

      filtered
        .slice()
        .sort((a, b) =&gt; new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt))
        .forEach((entry) =&gt; {
          const article = document.createElement(&#x27;article&#x27;);
          article.className = &#x27;knowledge-entry&#x27;;
          article.dataset.entryId = entry.id;

          const heading = document.createElement(&#x27;div&#x27;);
          heading.className = &#x27;entry-heading&#x27;;
          const meta = document.createElement(&#x27;div&#x27;);
          meta.className = &#x27;entry-meta&#x27;;
          [entry.type, labels[entry.node] || &#x27;myKIT&#x27;, ...(entry.tags || [])].forEach((value) =&gt; {
            const badge = document.createElement(&#x27;span&#x27;);
            badge.className = &#x27;viz-badge&#x27;;
            badge.textContent = value;
            meta.appendChild(badge);
          });
          const time = document.createElement(&#x27;span&#x27;);
          time.className = &#x27;text-small text-muted&#x27;;
          time.textContent = formatDate(entry.updatedAt || entry.createdAt);
          heading.append(meta, time);

          const text = document.createElement(&#x27;p&#x27;);
          text.textContent = entry.text;
          if (entry.done) {
            text.style.textDecoration = &#x27;line-through&#x27;;
            text.style.opacity = &#x27;0.7&#x27;;
          }

          const actions = document.createElement(&#x27;div&#x27;);
          actions.className = &#x27;entry-actions&#x27;;
          const actionSpecs = [
            [&#x27;open&#x27;, &#x27;Locate&#x27;, &#x27;locate-fixed&#x27;],
            [&#x27;edit&#x27;, &#x27;Edit&#x27;, &#x27;square-pen&#x27;],
            [&#x27;pin&#x27;, &#x27;Pin to map&#x27;, &#x27;pin&#x27;],
            [&#x27;done&#x27;, entry.done ? &#x27;Reopen&#x27; : &#x27;Complete&#x27;, entry.done ? &#x27;rotate-ccw&#x27; : &#x27;check&#x27;],
            [&#x27;delete&#x27;, &#x27;Delete&#x27;, &#x27;trash-2&#x27;]
          ];
          actionSpecs.forEach(([action, label, icon]) =&gt; {
            const button = document.createElement(&#x27;button&#x27;);
            button.type = &#x27;button&#x27;;
            button.className = &#x27;btn btn-ghost&#x27;;
            button.dataset.entryAction = action;
            button.dataset.entryId = entry.id;
            button.innerHTML = `&lt;i data-lucide=&quot;${icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; ${label}`;
            actions.appendChild(button);

    function saveEntry() {
      const text = quickEntry.value.trim();
      if (!text) {
        quickEntry.focus();
        return;
      }
      const now = new Date().toISOString();
      const tags = [...new Set(entryTags.value.split(&#x27;,&#x27;).map((tag) =&gt; tag.trim()).filter(Boolean))];
      if (editingId) {
        const existing = workspaceState.entries.find((entry) =&gt; entry.id === editingId);
        if (existing) Object.assign(existing, {
          text,
          type: entryType.value,
          node: entryNode.value,
          tags,
          updatedAt: now

      } else {
        workspaceState.entries.push({
          id: globalThis.crypto?.randomUUID?.() || `entry-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          text,
          type: entryType.value,
          node: entryNode.value,
          tags,
          createdAt: now,
          updatedAt: now,
          done: false
        });
      }
      clearComposer();
      renderEntries();
      saveWorkspace();
    }

    function appendCanvasNote(data, trackAction = false) {
      const note = document.createElement(&#x27;textarea&#x27;);
      note.className = &#x27;form-control annotation-note&#x27;;
      note.setAttribute(&#x27;aria-label&#x27;, &#x27;Canvas annotation note&#x27;);
      note.placeholder = &#x27;Type your note...&#x27;;
      note.style.left = data.left || &#x27;50%&#x27;;
      note.style.top = data.top || &#x27;50%&#x27;;
      note.value = data.text || &#x27;&#x27;;
      note.addEventListener(&#x27;input&#x27;, scheduleSave);
      notesLayer.appendChild(note);
      if (trackAction) {
        annotationActions.push({ type: &#x27;note&#x27;, element: note });

    }

    function setMode(nextMode) {
      mode = nextMode;
      toolButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.canvasTool === mode)));
      field.classList.toggle(&#x27;is-drawing&#x27;, mode === &#x27;draw&#x27;);
      field.classList.toggle(&#x27;is-note-mode&#x27;, mode === &#x27;note&#x27;);
      instruction.textContent = mode === &#x27;draw&#x27;
        ? &#x27;Draw directly on the canvas&#x27;
        : mode === &#x27;note&#x27;
          ? &#x27;Choose a location on the canvas for your note&#x27;
          : &#x27;Move nodes or select one to trace its connections&#x27;;
    }

    function updateUndo() {
      undoButton.disabled = annotationActions.length === 0;
    }

    function annotationPoint(event) {
      const box = field.getBoundingClientRect();
      return [
        Math.max(0, Math.min(1000, ((event.clientX - box.left) / box.width) * 1000)),
        Math.max(0, Math.min(1000, ((event.clientY - box.top) / box.height) * 1000))
      ];
    }

    function addNote(event) {
      const box = field.getBoundingClientRect();
      const left = Math.max(12, Math.min(88, ((event.clientX - box.left) / box.width) * 100));
      const top = Math.max(7, Math.min(93, ((event.clientY - box.top) / box.height) * 100));
      const note = appendCanvasNote({ left: `${left}%`, top: `${top}%`, text: &#x27;&#x27; }, true);
      setMode(&#x27;move&#x27;);
      note.focus();
      scheduleSave();
    }

    toolButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setMode(button.dataset.canvasTool)));

    annotationSvg.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
      if (mode !== &#x27;draw&#x27; || event.button !== 0) return;
      const [x, y] = annotationPoint(event);
      const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
      path.setAttribute(&#x27;class&#x27;, &#x27;annotation-stroke&#x27;);

    });

    field.addEventListener(&#x27;click&#x27;, (event) =&gt; {
      if (mode !== &#x27;note&#x27;) return;
      if (event.target.closest(&#x27;.annotation-note&#x27;)) return;
      addNote(event);
    });

    undoButton.addEventListener(&#x27;click&#x27;, () =&gt; {
      const action = annotationActions.pop();
      if (action) action.element.remove();
      updateUndo();
      scheduleSave();
    });

    nodes.forEach((node) =&gt; {
      let drag = null;
      node.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
        if (mode !== &#x27;move&#x27;) return;
        if (event.button !== 0) return;
        drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY, moved: false };
        node.setPointerCapture(event.pointerId);
      });
      node.addEventListener(&#x27;pointermove&#x27;, (event) =&gt; {
        if (!drag || event.pointerId !== drag.id) return;
        const fieldBox = field.getBoundingClientRect();
        const moved = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) &gt; 4;
        drag.moved = drag.moved || moved;
        if (!drag.moved) return;
        const scale = Number(zoom.value) / 100;
        const shownX = ((event.clientX - fieldBox.left) / fieldBox.width) * 100;
        const shownY = ((event.clientY - fieldBox.top) / fieldBox.height) * 100;
        positions[node.dataset.node] = [
          Math.max(5, Math.min(95, 50 + (shownX - 50) / scale)),
          Math.max(4, Math.min(96, 50 + (shownY - 50) / scale))
        ];

        render();
      });
      node.addEventListener(&#x27;pointerup&#x27;, (event) =&gt; {
        if (!drag || event.pointerId !== drag.id) return;
        node.releasePointerCapture(event.pointerId);
        if (drag.moved) scheduleSave();
        drag = null;
      });
      node.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (mode !== &#x27;move&#x27;) return;
        if (node.dataset.dragged === &#x27;true&#x27;) {
          node.dataset.dragged = &#x27;false&#x27;;
          event.preventDefault();
          return;
        }
        selectNode(node.dataset.node);
      });
    });

    saveEntryButton.addEventListener(&#x27;click&#x27;, saveEntry);
    clearEntryButton.addEventListener(&#x27;click&#x27;, clearComposer);
    quickEntry.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
      if ((event.ctrlKey || event.metaKey) &amp;&amp; event.key === &#x27;Enter&#x27;) {
        event.preventDefault();
        saveEntry();
      }
    });
    entrySearch.addEventListener(&#x27;input&#x27;, renderEntries);
    currentOnly.addEventListener(&#x27;change&#x27;, renderEntries);

    entryList.addEventListener(&#x27;click&#x27;, (event) =&gt; {
      const button = event.target.closest(&#x27;[data-entry-action]&#x27;);
      if (!button) return;
      const entry = workspaceState.entries.find((item) =&gt; item.id === button.dataset.entryId);
      if (!entry) return;
      const action = button.dataset.entryAction;

      if (action === &#x27;open&#x27;) {
        selectNode(entry.node);
        nodeFor(entry.node)?.focus();
      }
      if (action === &#x27;edit&#x27;) {
        editingId = entry.id;
        quickEntry.value = entry.text;
        entryType.value = entry.type;
        entryNode.value = entry.node;
        entryTags.value = (entry.tags || []).join(&#x27;, &#x27;);
        saveEntryButton.innerHTML = &#x27;&lt;i data-lucide=&quot;save&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Update entry&#x27;;
        if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
        quickEntry.focus();
      }
      if (action === &#x27;pin&#x27;) {
        const [left, top] = screenPosition(entry.node);
        const note = appendCanvasNote({
          left: `${Math.max(12, Math.min(88, left + 8))}%`,
          top: `${Math.max(7, Math.min(93, top + 8))}%`,
          text: entry.text
        }, true);
        note.focus();
        saveWorkspace();
      }
      if (action === &#x27;done&#x27;) {
        entry.done = !entry.done;
        entry.updatedAt = new Date().toISOString();
        renderEntries();
        saveWorkspace();
      }
      if (action === &#x27;delete&#x27;) {
        workspaceState.entries = workspaceState.entries.filter((item) =&gt; item.id !== entry.id);
        if (editingId === entry.id) clearComposer();
        renderEntries();
        saveWorkspace();
      }
    });

    exportButton.addEventListener(&#x27;click&#x27;, () =&gt; {
      collectWorkspaceState();
      const blob = new Blob([JSON.stringify({
        format: &#x27;mykit-connected-canvas&#x27;,
        version: 3,
        exportedAt: new Date().toISOString(),
        ...workspaceState
      }, null, 2)], { type: &#x27;application/json&#x27; });
      const url = URL.createObjectURL(blob);
      const link = document.createElement(&#x27;a&#x27;);
      link.href = url;
      link.download = `mykit-mind-dump-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
      saveStatus.textContent = &#x27;Backup exported&#x27;;
    });

    importInput.addEventListener(&#x27;change&#x27;, async () =&gt; {
      const file = importInput.files?.[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        if (!imported || !Array.isArray(imported.entries)) throw new Error(&#x27;Invalid backup&#x27;);
        workspaceState = {
          ...workspaceState,
          ...imported,
          entries: imported.entries,
          layouts: imported.layouts || workspaceState.layouts,
          strokes: Array.isArray(imported.strokes) ? imported.strokes : [],
          canvasNotes: Array.isArray(imported.canvasNotes) ? imported.canvasNotes : []
        };
        annotationSvg.replaceChildren();
        notesLayer.replaceChildren();
        workspaceState.strokes.forEach((pathData) =&gt; {
          const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
          path.setAttribute(&#x27;class&#x27;, &#x27;annotation-stroke&#x27;);
          path.setAttribute(&#x27;d&#x27;, pathData);
          annotationSvg.appendChild(path);
        });
        workspaceState.canvasNotes.forEach((note) =&gt; appendCanvasNote(note));
        zoom.value = String(workspaceState.zoom || 92);
        setLayout(true);
        selectNode(details[workspaceState.selected] ? workspaceState.selected : &#x27;mykit&#x27;);
        clearComposer();
        renderEntries();
        saveWorkspace();
        saveStatus.textContent = &#x27;Backup restored&#x27;;
      } catch (error) {
        saveStatus.textContent = &#x27;That file is not a myKIT backup&#x27;;
      } finally {
        importInput.value = &#x27;&#x27;;
      }
    });

    zoom.addEventListener(&#x27;input&#x27;, () =&gt; {
      render();
      scheduleSave();
    });
    new ResizeObserver(() =&gt; {
      setLayout();
      render();
    }).observe(field);

    Object.entries(labels).forEach(([value, label]) =&gt; {
      const option = document.createElement(&#x27;option&#x27;);
      option.value = value;
      option.textContent = label;
      entryNode.appendChild(option);
    });

    zoom.value = String(workspaceState.zoom || 92);
    workspaceState.strokes.forEach((pathData) =&gt; {
      const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
      path.setAttribute(&#x27;class&#x27;, &#x27;annotation-stroke&#x27;);
      path.setAttribute(&#x27;d&#x27;, pathData);
      annotationSvg.appendChild(path);
    });
    workspaceState.canvasNotes.forEach((note) =&gt; appendCanvasNote(note));

    setLayout(true);
    selectNode(details[workspaceState.selected] ? workspaceState.selected : &#x27;mykit&#x27;);
    setMode(&#x27;move&#x27;);
    updateUndo();
    renderEntries();
  })();
&lt;/script&gt;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  let skipDelayUntil = 0;

      .then(({ x, y }) =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

      return;
    }

    if (activeTrigger === trigger) {

    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
